<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#12161c">
  <title>Teseo</title>

  <!-- El manifiesto es la ficha de la aplicación: nombre, icono y colores.
       Es lo que Android lee para ofrecer instalarla en la pantalla de inicio. -->
  <link rel="manifest" href="./manifest.webmanifest">
  <link rel="apple-touch-icon" href="./iconos/apple-touch-icon.png">
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-title" content="Teseo">

  <link rel="stylesheet" href="./css/estilos.css">
</head>
<body>

  <header>
    <h1>Teseo <span class="version" id="version"></span></h1>
    <button class="boton boton-principal" type="button" id="btn-instalar" hidden>
      Instalar en la pantalla de inicio
    </button>
  </header>

  <!-- Toda la aplicación se dibuja aquí dentro, desde JavaScript.
       Cada pantalla vacía este contenedor y pinta lo suyo. -->
  <main id="pantalla">
    <p class="ayuda">Cargando…</p>
  </main>

  <script type="module" src="./js/app.js"></script>
</body>
</html>
